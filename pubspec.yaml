name: tally
description: A shared trip expense calculator.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database (works on Android, iOS, and Chrome/web)
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.0
  path: ^1.9.0
  supabase_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_gherkin: ^2.0.0

  # Code generation for Drift
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true